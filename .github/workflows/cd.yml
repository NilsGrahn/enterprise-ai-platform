name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write          # required to push to GHCR

jobs:

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api, dashboard, jobs]
        # Runs this job three times in parallel, once per service.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the base image
        run: docker build -f infrastructure/docker/Dockerfile.base -t eap-base:latest .

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the service image
        run: docker build -f infrastructure/docker/Dockerfile.${{ matrix.service }} -t local-image:latest .