name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: credit_platform_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: credit_platform_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      ACTIVE_PIPELINE: credit
      MODEL_VERSION: v1
      ARTIFACT_DIR: ./artifacts
      DECISION_THRESHOLD: "0.5"
      LLM_ENABLED: "false"
      LLM_API_KEY: ""

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1
        # Same reason as Dockerfile.base — XGBoost needs the OpenMP runtime.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: python -m data_platform.migrate
        # An integration check, not a unit test: proves the SQL actually applies
        # to a real, empty Postgres.

      - name: Run tests
        run: pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=45

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    needs: lint-and-test          # only runs if the tests passed

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.base
          tags: eap-base:latest
          load: true                 # keep it in the local daemon for later steps

      - name: Build the service images
        run: |
          docker build -f infrastructure/docker/Dockerfile.api       -t eap-api:${{ github.sha }} .
          docker build -f infrastructure/docker/Dockerfile.dashboard -t eap-dashboard:${{ github.sha }} .
          docker build -f infrastructure/docker/Dockerfile.jobs      -t eap-jobs:${{ github.sha }} .

      - name: Check the dashboard image cannot import the model layer
        run: |
          if docker run --rm eap-dashboard:${{ github.sha }} python -c "import ml_service" 2>/dev/null; then
            echo "FAIL: the dashboard image contains ml_service — ADR-0007 is violated"
            exit 1
          fi
          echo "OK: the dashboard image cannot import ml_service"

      - name: Smoke test the API image
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e ACTIVE_PIPELINE=credit -e MODEL_VERSION=v1 \
            eap-api:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health/live; then
              echo "API is alive"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health/live
          docker logs api-smoke | tail -20
          docker rm -f api-smoke