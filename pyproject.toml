[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform"
version = "0.1.0"

[tool.setuptools.packages.find]
where = [
    "integration-service/src",
    "data-platform/src",
    "ml-service/src",
    "explain-service/src",
    "llm-service/src",
    "monitoring/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100